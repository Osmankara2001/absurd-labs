
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absurd Labs</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 { color: #a78bfa; font-size: 38px; }
    .subtitle { color: #9ca3af; }

    .form, .card {
      background: #1f2937;
      padding: 24px;
      border-radius: 14px;
      margin-top: 20px;
    }

    .inputs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #374151;
      color: white;
      font-size: 15px;
    }

    button {
      background: #8b5cf6;
      border: none;
      color: white;
      padding: 14px 25px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .card h2 { margin-top: 0; }
    .inventor { border-left: 5px solid #a78bfa; }
    .engineer { border-left: 5px solid #38bdf8; }
    .investor { border-left: 5px solid #4ade80; }

    .content {
      white-space: pre-wrap;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #results { display: none; }
    #status { margin-top: 15px; color: #c4b5fd; }

    @media (max-width: 600px) {
      .inputs { flex-direction: column; }
      .container { margin: 15px auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 ABSURD LABS</h1>
    <p class="subtitle">
      Üç kelime gir. Yapay zekâ saçma bir icat üretsin!
    </p>

    <div class="form">
      <h2>Yeni İcat</h2>

      <div class="inputs">
        <input id="word1" placeholder="Patates" maxlength="50">
        <input id="word2" placeholder="Terlik" maxlength="50">
        <input id="word3" placeholder="Wi-Fi" maxlength="50">
      </div>

      <button id="generate" onclick="invent()">
        🚀 İcat Üret
      </button>

      <p id="status" role="status"></p>
    </div>

    <div id="results">
      <div class="card inventor">
        <h2>🧪 Çılgın Mucit</h2>
        <div id="inventor" class="content"></div>
      </div>

      <div class="card engineer">
        <h2>🔧 Huysuz Mühendis</h2>
        <div id="engineer" class="content"></div>
      </div>

      <div class="card investor">
        <h2>💰 Açgözlü Yatırımcı</h2>
        <div id="investor" class="content"></div>
      </div>
    </div>
  </div>

  <script>
    async function invent() {
      const words = [
        document.getElementById("word1").value.trim(),
        document.getElementById("word2").value.trim(),
        document.getElementById("word3").value.trim()
      ];

      const status = document.getElementById("status");
      const button = document.getElementById("generate");
      const results = document.getElementById("results");

      if (words.some(word => !word)) {
        status.textContent = "Lütfen üç kelime gir!";
        return;
      }

      button.disabled = true;
      status.textContent = "🧪 Laboratuvar çalışıyor...";
      results.style.display = "none";

      try {
        const response = await fetch("/invent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ words })
        });

        if (!response.ok) {
          throw new Error("API isteği başarısız oldu.");
        }

        const data = await response.json();

        document.getElementById("inventor").textContent = data.inventor;
        document.getElementById("engineer").textContent = data.engineer;
        document.getElementById("investor").textContent = data.investor;

        results.style.display = "block";
        status.textContent = "🎉 İcadın hazır!";

      } catch (error) {
        status.textContent = "❌ " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
